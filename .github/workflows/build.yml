name: build-image
on:
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: free disk space (the CUDA base image is big)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: lower-case image name
        run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/h3-comfy" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with: { context: ., push: true, tags: "${{ env.IMG }}:latest" }
